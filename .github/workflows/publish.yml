name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: New stable X.Y.Z version without a v prefix; an existing tag recovers that release
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out main history and tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Resolve release source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          PACKAGE_NAME: n8n-nodes-netbox-connector
        run: |
          set -euo pipefail
          VERSION_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          TAG_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          ignore_release() {
            echo 'ignore=true' >> "$GITHUB_OUTPUT"
            exit 0
          }

          git fetch --tags origin
          MODE=''
          VERSION=''
          TAG=''
          TAG_EXISTS=false
          SOURCE_SHA=''

          case "$EVENT_NAME" in
            release)
              if [[ "$RELEASE_DRAFT" == 'true' || "$RELEASE_PRERELEASE" == 'true' ]]; then
                ignore_release
              fi
              if [[ ! "$RELEASE_TAG" =~ $TAG_RE ]]; then
                ignore_release
              fi
              MODE=release
              TAG="$RELEASE_TAG"
              VERSION="${TAG#v}"
              ;;
            workflow_dispatch)
              if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
                echo 'Manual publishing must be dispatched from main.' >&2
                exit 1
              fi
              if [[ ! "$VERSION_INPUT" =~ $VERSION_RE ]]; then
                echo 'Version must be stable X.Y.Z semver without a v prefix.' >&2
                exit 1
              fi
              MODE=manual
              VERSION="$VERSION_INPUT"
              TAG="v$VERSION"
              ;;
            push)
              if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
                echo 'Automatic publishing only accepts main pushes.' >&2
                exit 1
              fi
              if [[ "$(git rev-parse origin/main)" != "$EVENT_SHA" ]]; then
                echo 'Skipping a stale main push; a newer main commit will publish the accumulated changes.'
                ignore_release
              fi
              MODE=automatic
              SOURCE_SHA="$EVENT_SHA"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$MODE" != 'automatic' ]]; then
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              if ! git cat-file -e "$TAG^{commit}" 2>/dev/null; then
                echo "Tag $TAG does not resolve to a commit." >&2
                exit 1
              fi
              TAG_EXISTS=true
              SOURCE_SHA="$(git rev-parse "$TAG^{commit}")"
            else
              if [[ "$MODE" == 'release' ]]; then
                echo "Published release tag $TAG is missing from the repository." >&2
                exit 1
              fi
              SOURCE_SHA="$EVENT_SHA"
            fi
            if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
              echo "Release source $SOURCE_SHA is not an ancestor of main." >&2
              exit 1
            fi
          else
            if ! git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null; then
              echo "Main push source $SOURCE_SHA is missing from the repository." >&2
              exit 1
            fi
            node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const hasStableTag = execFileSync('git', ['tag', '--list'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .some(tag => /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag));
          if (!hasStableTag) throw new Error('No stable release tag exists; seed the verified npm baseline before automatic publishing.');
          NODE
          fi

          if [[ "$MODE" == 'manual' && "$TAG_EXISTS" != 'true' ]]; then
            node - "$VERSION" "$PACKAGE_NAME" <<'NODE'
          const { execFileSync } = require('node:child_process');
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const parse = (value) => {
            const match = versionPattern.exec(value);
            if (!match) throw new Error(`Invalid stable semantic version: ${value}`);
            const parts = match.slice(1).map(Number);
            if (parts.some(part => !Number.isSafeInteger(part))) {
              throw new Error(`Version components exceed the safe SemVer range: ${value}`);
            }
            return parts;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] < right[index] ? -1 : 1;
            }
            return 0;
          };
          const [requestedText, packageName] = process.argv.slice(2);
          const requested = parse(requestedText);
          const tags = execFileSync('git', ['tag', '--list'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(tag => /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag))
            .map(tag => parse(tag.slice(1)));
          const highestTag = tags.reduce((highest, tag) => !highest || compare(tag, highest) > 0 ? tag : highest, null);
          if (highestTag && compare(requested, highestTag) <= 0) {
            throw new Error('A new version must exceed the highest existing stable git tag.');
          }
          (async () => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(packageName)}/latest`, {
              headers: { accept: 'application/vnd.npm.install-v1+json' },
            });
            let latest = null;
            if (response.status !== 404) {
              if (!response.ok) throw new Error(`npm registry returned HTTP ${response.status} for latest metadata.`);
              const metadata = await response.json();
              latest = parse(metadata.version);
            }
            if (latest && compare(requested, latest) <= 0) {
              throw new Error('A new version must exceed the latest stable npm version.');
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          fi

          git checkout --detach "$SOURCE_SHA"
          {
            echo "ignore=false"
            echo "mode=$MODE"
            echo "version=$VERSION"
            echo "tag_exists=$TAG_EXISTS"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set package version in the runner
        if: steps.source.outputs.ignore != 'true' && steps.source.outputs.mode != 'automatic'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install locked dependencies
        if: steps.source.outputs.ignore != 'true'
        run: npm ci --ignore-scripts

      - name: Test package
        if: steps.source.outputs.ignore != 'true'
        run: npm test

      - name: Check generated-operation coverage
        if: steps.source.outputs.ignore != 'true'
        run: npm run check:coverage

      - name: Lint package
        if: steps.source.outputs.ignore != 'true'
        run: npm run lint

      - name: Pack package
        if: steps.source.outputs.ignore != 'true'
        run: npm pack --dry-run

      - name: Publish automatic main release
        if: steps.source.outputs.ignore != 'true' && steps.source.outputs.mode == 'automatic'
        run: npx --no-install semantic-release

      - name: Check existing npm version
        id: npm-version
        if: steps.source.outputs.ignore != 'true' && steps.source.outputs.mode != 'automatic'
        env:
          PACKAGE_NAME: n8n-nodes-netbox-connector
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          node <<'NODE'
          const { PACKAGE_NAME, VERSION, SOURCE_SHA } = process.env;
          (async () => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(PACKAGE_NAME)}/${encodeURIComponent(VERSION)}`, {
              headers: { accept: 'application/vnd.npm.install-v1+json' },
            });
            if (response.status === 404) {
              require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'already_published=false\n');
              return;
            }
            if (!response.ok) throw new Error(`npm registry returned HTTP ${response.status} for ${PACKAGE_NAME}@${VERSION}.`);
            const metadata = await response.json();
            if (metadata.version !== VERSION || metadata.gitHead !== SOURCE_SHA) {
              throw new Error(`${PACKAGE_NAME}@${VERSION} exists with gitHead ${metadata.gitHead ?? 'missing'}, expected ${SOURCE_SHA}.`);
            }
            console.log(`${PACKAGE_NAME}@${VERSION} already exists at the requested source commit.`);
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'already_published=true\n');
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Publish npm package
        if: steps.source.outputs.ignore != 'true' && steps.source.outputs.mode != 'automatic' && steps.npm-version.outputs.already_published != 'true'
        run: npm publish --access public

      - name: Create tag and GitHub release
        if: steps.source.outputs.ignore != 'true' && steps.source.outputs.mode != 'automatic'
        uses: actions/github-script@v7
        env:
          MODE: ${{ steps.source.outputs.mode }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_ID: ${{ github.event.release.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tag = `v${process.env.VERSION}`;
            const expectedSha = process.env.SOURCE_SHA;
            const resolveTag = async () => {
              let object = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data.object;
              for (let depth = 0; depth < 8; depth += 1) {
                if (object.type === "commit") return object.sha;
                if (object.type !== "tag") throw new Error(`Tag ${tag} does not resolve to a commit.`);
                object = (await github.rest.git.getTag({ owner, repo, tag_sha: object.sha })).data.object;
              }
              throw new Error(`Tag ${tag} has too many nested annotated tags.`);
            };
            let tagSha;
            try {
              tagSha = await resolveTag();
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagSha && tagSha !== expectedSha) throw new Error(`Tag ${tag} resolves to ${tagSha}, expected ${expectedSha}.`);
            if (!tagSha) {
              if (process.env.MODE === "release") throw new Error(`Published release tag ${tag} does not exist.`);
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: expectedSha });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              tagSha = await resolveTag();
              if (tagSha !== expectedSha) throw new Error(`Tag ${tag} resolves to ${tagSha}, expected ${expectedSha}.`);
            }

            if (process.env.MODE === "release") {
              const release = (await github.rest.repos.getRelease({ owner, repo, release_id: Number(process.env.RELEASE_ID) })).data;
              if (release.tag_name !== tag || release.draft || release.prerelease) {
                throw new Error(`Published release ${process.env.RELEASE_ID} does not match stable tag ${tag}.`);
              }
              core.info(`Reusing published release ${release.html_url}.`);
              return;
            }
            try {
              const release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (release.tag_name !== tag) throw new Error(`Existing release has unexpected tag ${release.tag_name}.`);
              core.info(`Release ${release.html_url} already exists for ${tag}.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
            });
